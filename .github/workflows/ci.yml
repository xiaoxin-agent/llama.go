name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: format
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1 -race

      - name: cover
        run: go test ./... -count=1 -cover

      - name: build
        run: go build ./...
